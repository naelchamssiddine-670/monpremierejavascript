<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Jeu de calcul</title>
    <link rel="stylesheet" href="calculAge.css">
    <script src="dom.js" defer></script>
</head>

<body>

<p>Formulaire</p>

<form>

    <div>
        <label for="prenom">Prénom(s):</label>
        <input type="text" name="prenom" id="prenom">

        <label for="nom">Nom:</label>
        <input type="text" name="nom" id="nom">
    </div>

    <br><br>

    <p>Situation :</p>

    <div>
        <label for="anneeNaissance">Année de naissance:</label>
        <input type="number" id="anneeNaissance" placeholder="aaaa">

        <label for="age">Âge:</label>
        <input type="number" id="age" readonly>
    </div>

    <br><br>

    <input type="radio" id="etudiant" name="situation">
    <label for="etudiant">Étudiant</label><br>

    <input type="radio" id="salarie" name="situation">
    <label for="salarie">Salarié</label>

    <br><br>

    <input type="button" value="Valider" id="boutonValider">
    <br><br>

</form>

<script src="calculAge.js"></script>
</body>
</html>
