<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date HTML</title>
    <link rel="stylesheet" href="date.css">
</head>
<body>
<h2>Horloge mondial :</h2>
<!-- Menu déroulant pour choisir le fuseau horaire -->
    <select id="timezone">
        <option value="local">Maoré</option>
        <option value="Europe/Paris">Farantsa</option>
        <option value="America/New_York">New York</option>
        <option value="Asia/Tokyo">Tokyo</option>
    </select>

    <!-- Div où sera affichée la date et l'heure -->
    <div id="datetime"></div>

</body>

<script src="manipulationDate.js"></script>
</html>
